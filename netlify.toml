[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Serverske funkcije za potvrde dolaska i admin panel (Netlify Functions + Netlify Blobs)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Admin panel se ne indeksira na pretraživačima
[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Pozivnica za svadbeno slavlje u restoranu: /restoran (bez kose crte na kraju)
[[redirects]]
  from = "/restoran"
  to = "/restoran/index.html"
  status = 200

[[headers]]
  for = "/vjencanje-sejla-edvin.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
    Content-Disposition = "attachment; filename=vjencanje-sejla-edvin.ics"

[[headers]]
  for = "/slavlje-sejla-edvin.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
    Content-Disposition = "attachment; filename=slavlje-sejla-edvin.ics"
