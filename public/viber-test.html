<!doctype html>
<html lang="bs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Viber test</title>
<style>
  body { margin: 0; padding: 16px; font: 17px/1.45 system-ui, -apple-system, sans-serif; background: #fbf7ef; color: #3b2f22; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  .info { padding: 10px 12px; border-radius: 10px; background: #fff; border: 1px solid #e3d3b2; font-size: 14px; word-break: break-word; }
  .who { display: flex; gap: 8px; margin: 14px 0; }
  .who label { flex: 1; padding: 10px; border-radius: 10px; background: #fff; border: 1px solid #e3d3b2; text-align: center; }
  a.t { display: block; margin: 10px 0; padding: 14px; border-radius: 12px; background: #7360f2; color: #fff; text-decoration: none; font-weight: 600; }
  a.t small { display: block; font-weight: 400; opacity: .85; font-size: 12px; word-break: break-all; margin-top: 4px; }
  a.t.wa { background: #1da851; }
</style>
</head>
<body>
<h1>Viber test – koji link radi?</h1>
<p>Dodirnite svaki broj redom (1, 2, 3...) i zapamtite <b>koji brojevi otvore Viber razgovor</b>. Probajte s telefona koji <b>nije</b> broj kojem šaljete.</p>
<div class="info" id="env"></div>
<div class="who">
  <label><input type="radio" name="who" value="387603292251" checked /> Šejla</label>
  <label><input type="radio" name="who" value="387644107473" /> Edvin</label>
</div>
<div id="links"></div>
<script>
  var ua = navigator.userAgent;
  var where = /Viber/i.test(ua) ? 'unutar Vibera' : /FBAN|FBAV|Instagram/i.test(ua) ? 'unutar Facebooka/Instagrama' :
    /; wv\)/.test(ua) ? 'unutar neke aplikacije' : /CriOS/.test(ua) ? 'Chrome (iPhone)' : /SamsungBrowser/.test(ua) ? 'Samsung Internet' :
    /Chrome/.test(ua) ? 'Chrome' : /Safari/.test(ua) ? 'Safari' : 'nepoznat preglednik';
  document.getElementById('env').textContent = 'Otvoreno u: ' + where + ' · ' + ua;

  function render() {
    var n = document.querySelector('input[name=who]:checked').value;
    var text = encodeURIComponent('Test poruka – pozivnica Šejla & Edvin');
    var v = [
      ['viber://chat?number=%2B' + n, ''],
      ['viber://chat?number=' + n, ''],
      ['viber://chat/?number=%2B' + n, ''],
      ['viber://chat?number=+' + n, ''],
      ['intent://chat?number=%2B' + n + '#Intent;scheme=viber;package=com.viber.voip;end', 'samo Android'],
      ['viber://contact?number=%2B' + n, ''],
      ['viber://forward?text=' + text, 'Viber s upisanom porukom, sami birate osobu'],
      ['https://wa.me/' + n + '?text=' + text, 'WhatsApp (za poređenje)']
    ];
    document.getElementById('links').innerHTML = v.map(function (x, i) {
      return '<a class="t' + (x[0].indexOf('wa.me') > -1 ? ' wa' : '') + '" href="' + x[0] + '">' + (i + 1) + '. Probaj' +
        (x[1] ? ' – ' + x[1] : '') + '<small>' + x[0].replace(/&/g, '&amp;') + '</small></a>';
    }).join('');
  }
  document.querySelectorAll('input[name=who]').forEach(function (r) { r.addEventListener('change', render); });
  render();
</script>
</body>
</html>
