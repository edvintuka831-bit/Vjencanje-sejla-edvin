name: Produkcijski build – restoranska pozivnica
on:
  push:
    branches: [build-restoran-zip]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1669b5ab3c2cfb2ffc2badfb52a69005dada4065
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm ci
        run: npm ci --no-audit --no-fund 2>&1 | tee npm-install.log
      - name: npm run build (SITE_VARIANT=restoran)
        env:
          SITE_VARIANT: restoran
        run: npm run build 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
      - name: ZIP
        run: |
          test -f dist/index.html
          (cd dist && zip -qr -X ../sejla-edvin-restoran.zip .)
          (cd dist && find . -type f | sort | xargs ls -l) > dist-listing.txt
          { echo "commit: 1669b5ab3c2cfb2ffc2badfb52a69005dada4065"; node -v; npm -v; date -u; } > build-info.txt
      - name: Spremi rezultat na granu build-output
        run: |
          mkdir out && cp sejla-edvin-restoran.zip dist-listing.txt build.log npm-install.log build-info.txt out/
          cd out && git init -q -b build-output
          git -c user.name=github-actions -c user.email=actions@github.com add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Build 1669b5ab3c2cfb2ffc2badfb52a69005dada4065"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" build-output
